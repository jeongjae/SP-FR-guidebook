<h1>Avignon·Alpilles 실행지도 v0.2</h1>
<p>Day 20–24 일정의 기준점. 번호는 실행 순서의 대략적 흐름이며 실제 날짜별 순서와 다를 수 있다.</p>
<p class="note">숙소 핀은 예약 전 후보이며 확정 주소가 아니다.</p>
<p>배경지도와 Google Maps 링크는 인터넷 연결이 필요하다. GeoJSON·KML은 별도 앱에서 사용할 수 있다.</p>
<div class="legend"><span><i style="background:#7a4eab"></i>숙소 후보</span><span><i style="background:#1f4e78"></i>핵심 방문지</span><span><i style="background:#2f7d32"></i>시장·생활</span><span><i style="background:#c75b12"></i>교통</span><span><i style="background:#b02a37"></i>근교·이동지</span></div></div>
<script src="vendor/leaflet/leaflet.js"></script><script>
const pts=[{"name": "La Terrasse du Clocher", "lat": 43.94993, "lon": 4.81302, "category": "숙소 후보", "status": "후보 — 실제 예약 후 교체", "url": "https://www.google.com/maps/search/?api=1&query=La+Terrasse+du+Clocher"}, {"name": "Les Halles", "lat": 43.94787, "lon": 4.80903, "category": "시장·생활", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Les+Halles"}, {"name": "Palais des Papes", "lat": 43.95078, "lon": 4.8075, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Palais+des+Papes"}, {"name": "Pont Saint-Bénézet", "lat": 43.95389, "lon": 4.80508, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Pont+Saint-Bénézet"}, {"name": "Uzès", "lat": 44.0121, "lon": 4.41974, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Uzès"}, {"name": "Pont du Gard", "lat": 43.9475, "lon": 4.53502, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Pont+du+Gard"}, {"name": "Les Baux", "lat": 43.74473, "lon": 4.79531, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Les+Baux"}, {"name": "Saint-Rémy", "lat": 43.78842, "lon": 4.83168, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Saint-Rémy"}];
const colors={"숙소 후보": "#7a4eab", "핵심 방문지": "#1f4e78", "시장·생활": "#2f7d32", "교통": "#c75b12", "근교·이동지": "#b02a37"};
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const ll=[];
pts.forEach((p,i)=>{
 ll.push([p.lat,p.lon]);
 const marker=L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:2,fillColor:colors[p.category],fillOpacity:.95}).addTo(map);
 const PLACE={"Les Baux": "les-baux-de-provence", "Les Halles": "les-halles", "Palais des Papes": "palais-des-papes", "Pont Saint-Bénézet": "pont-saint-benezet", "Pont du Gard": "pont-du-gard", "Saint-Rémy": "saint-remy-de-provence", "Uzès": "uzes"};
 marker.bindPopup(`<b>${i+1}. ${p.name}</b><br>${p.category}<br><small>${p.status}</small><br><a target="_blank" href="${p.url}">Google Maps 열기</a>${PLACE[p.name]?`<br><a href="../places/${PLACE[p.name]}.html">◇ 장소 카드</a>`:''}`);
});
L.polyline(ll,{color:'#59636e',weight:3,opacity:.6,dashArray:'7,8'}).addTo(map);
map.fitBounds(L.latLngBounds(ll).pad(.15));
</script></body></html>
