<h1>Paris 실행지도 v0.2</h1>
<p>Day 28–43 일정의 기준점. 번호는 실행 순서의 대략적 흐름이며 실제 날짜별 순서와 다를 수 있다.</p>
<p class="note">숙소 핀은 예약 전 후보이며 확정 주소가 아니다.</p>
<p>배경지도와 Google Maps 링크는 인터넷 연결이 필요하다. GeoJSON·KML은 별도 앱에서 사용할 수 있다.</p>
<div class="legend"><span><i style="background:#7a4eab"></i>숙소 후보</span><span><i style="background:#1f4e78"></i>핵심 방문지</span><span><i style="background:#2f7d32"></i>시장·생활</span><span><i style="background:#c75b12"></i>교통</span><span><i style="background:#b02a37"></i>근교·이동지</span></div></div>
<script src="vendor/leaflet/leaflet.js"></script><script>
const pts=[{"name": "Pepper & Paper", "lat": 48.83966, "lon": 2.34644, "category": "숙소 후보", "status": "후보 — 실제 예약 후 교체", "url": "https://www.google.com/maps/search/?api=1&query=Pepper+&+Paper"}, {"name": "Notre-Dame", "lat": 48.85297, "lon": 2.3499, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Notre-Dame"}, {"name": "Louvre", "lat": 48.86061, "lon": 2.33764, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Louvre"}, {"name": "Montmartre", "lat": 48.8867, "lon": 2.3431, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Montmartre"}, {"name": "BnF Richelieu", "lat": 48.867, "lon": 2.33838, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=BnF+Richelieu"}, {"name": "Grand Palais", "lat": 48.86613, "lon": 2.31247, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Grand+Palais"}, {"name": "Orsay", "lat": 48.85996, "lon": 2.32656, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Orsay"}, {"name": "Bourse de Commerce", "lat": 48.86245, "lon": 2.3422, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Bourse+de+Commerce"}, {"name": "Versailles", "lat": 48.80486, "lon": 2.12036, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Versailles"}, {"name": "Giverny", "lat": 49.0754, "lon": 1.53375, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Giverny"}];
const colors={"숙소 후보": "#7a4eab", "핵심 방문지": "#1f4e78", "시장·생활": "#2f7d32", "교통": "#c75b12", "근교·이동지": "#b02a37"};
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const ll=[];
pts.forEach((p,i)=>{
 ll.push([p.lat,p.lon]);
 const marker=L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:2,fillColor:colors[p.category],fillOpacity:.95}).addTo(map);
 const PLACE={"BnF Richelieu": "bnf-richelieu", "Bourse de Commerce": "bourse-de-commerce-pinault-collection", "Giverny": "giverny", "Grand Palais": "grand-palais", "Montmartre": "montmartre-south-pigalle", "Orsay": "musee-d-orsay", "Louvre": "musee-du-louvre", "Notre-Dame": "notre-dame-de-paris", "Versailles": "versailles"};
 marker.bindPopup(`<b>${i+1}. ${p.name}</b><br>${p.category}<br><small>${p.status}</small><br><a target="_blank" href="${p.url}">Google Maps 열기</a>${PLACE[p.name]?`<br><a href="../places/${PLACE[p.name]}.html">◇ 장소 카드</a>`:''}`);
});
L.polyline(ll,{color:'#59636e',weight:3,opacity:.6,dashArray:'7,8'}).addTo(map);
map.fitBounds(L.latLngBounds(ll).pad(.15));
</script></body></html>
