<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paris Execution Map</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>html,body,#map{height:100%;margin:0}body{font-family:Arial,'Noto Sans KR',sans-serif}
.panel{position:absolute;z-index:1000;left:12px;top:12px;background:#fffffff2;padding:12px 14px;border-radius:9px;
box-shadow:0 2px 12px #0004;max-width:330px}h1{font-size:18px;margin:0 0 5px}p{font-size:12px;margin:0;line-height:1.4}</style>
</head><body><div id="map"></div><a href="../maps/index.html" style="position:absolute;z-index:1100;right:12px;top:12px;background:#1f4e78;color:#fff;padding:7px 12px;border-radius:8px;font-size:13px;text-decoration:none;box-shadow:0 1px 6px rgba(0,0,0,.3)">← 지도 목록</a><div class="panel"><h1>Paris 실행지도</h1>
<p>현재 MD 일정에 따른 주요 기준점. 실제 도보·운전은 Google Maps에서 다시 계산한다.</p></div>
<script src="vendor/leaflet/leaflet.js"></script><script>
const pts=[{"name": "Pepper & Paper", "lat": 48.83966, "lon": 2.34644, "url": "https://www.google.com/maps/search/?api=1&query=Pepper+%26+Paper"}, {"name": "Notre-Dame", "lat": 48.85297, "lon": 2.3499, "url": "https://www.google.com/maps/search/?api=1&query=Notre-Dame"}, {"name": "Louvre", "lat": 48.86061, "lon": 2.33764, "url": "https://www.google.com/maps/search/?api=1&query=Louvre"}, {"name": "Montmartre", "lat": 48.8867, "lon": 2.3431, "url": "https://www.google.com/maps/search/?api=1&query=Montmartre"}, {"name": "BnF Richelieu", "lat": 48.867, "lon": 2.33838, "url": "https://www.google.com/maps/search/?api=1&query=BnF+Richelieu"}, {"name": "Grand Palais", "lat": 48.86613, "lon": 2.31247, "url": "https://www.google.com/maps/search/?api=1&query=Grand+Palais"}, {"name": "Orsay", "lat": 48.85996, "lon": 2.32656, "url": "https://www.google.com/maps/search/?api=1&query=Orsay"}, {"name": "Bourse de Commerce", "lat": 48.86245, "lon": 2.3422, "url": "https://www.google.com/maps/search/?api=1&query=Bourse+de+Commerce"}, {"name": "Versailles", "lat": 48.80486, "lon": 2.12036, "url": "https://www.google.com/maps/search/?api=1&query=Versailles"}, {"name": "Giverny", "lat": 49.0754, "lon": 1.53375, "url": "https://www.google.com/maps/search/?api=1&query=Giverny"}];
const map=L.map('map');L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const ll=[];pts.forEach((p,i)=>{ll.push([p.lat,p.lon]);L.marker([p.lat,p.lon]).addTo(map)
.bindPopup(`<b>${i+1}. ${p.name}</b><br><a target="_blank" href="${p.url}">Google Maps</a>`);});
L.polyline(ll,{color:'#1f4e78',weight:4,opacity:.65,dashArray:'8,8'}).addTo(map);
map.fitBounds(L.latLngBounds(ll).pad(.15));</script></body></html>
