<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Girona·Empordà 실행지도 v0.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0} body{font-family:Arial,'Noto Sans KR',sans-serif}
.panel{position:absolute;z-index:1000;left:12px;top:12px;background:#fffffff2;padding:12px 14px;border-radius:9px;box-shadow:0 2px 12px #0004;max-width:370px}
h1{font-size:18px;margin:0 0 5px} p{font-size:12px;margin:4px 0;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:11px}
.legend span{white-space:nowrap} .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.note{color:#8a3d12;font-weight:bold}
</style></head><body>
<div id="map"></div><div class="panel">
<h1>Bàscara·Girona·Empordà 실행지도 v0.2</h1>
<p>Day 4–7 일정의 기준점. Day 2는 Collioure·Cadaqués, Day 3은 Tossa·Sant Feliu·Pals·Peratallada 핵심 동선을 표시한다.</p>
<p class="note">Bàscara 숙소는 예약 확정이다. 체크인 시간·주차·조식·결제·취소조건은 재확인한다.</p>
<p>배경지도와 Google Maps 링크는 인터넷 연결이 필요하다. GeoJSON·KML은 별도 앱에서 사용할 수 있다.</p>
<div class="legend"><span><i style="background:#0b7a53"></i>확정 숙소</span><span><i style="background:#1f4e78"></i>핵심 방문지</span><span><i style="background:#2f7d32"></i>시장·생활</span><span><i style="background:#c75b12"></i>교통</span><span><i style="background:#b02a37"></i>대체안·기준점</span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const pts=[{"name":"Bàscara 확정 숙소","lat":42.164,"lon":2.914,"category":"확정 숙소","status":"Airbnb · 바스카라의 B&B · 예약 확정 · 2026-09-01~09-04","url":"https://www.google.com/maps/search/?api=1&query=B%C3%A0scara"},{"name":"Girona Cathedral","lat":41.98741,"lon":2.82611,"category":"핵심 방문지","status":"기준점","url":"https://www.google.com/maps/search/?api=1&query=Girona+Cathedral"},{"name":"Onyar Houses","lat":41.98473,"lon":2.82402,"category":"핵심 방문지","status":"기준점","url":"https://www.google.com/maps/search/?api=1&query=Onyar+Houses"},{"name":"Collioure","lat":42.52505,"lon":3.08322,"category":"핵심 방문지","status":"Day 2 · 오전 10시 이전 도착 유지","url":"https://www.google.com/maps/search/?api=1&query=Collioure"},{"name":"Cadaqués","lat":42.2886,"lon":3.2584,"category":"핵심 방문지","status":"Day 2 · 해안 쪽 우회 · Saba 주차 재확인","url":"https://www.google.com/maps/search/?api=1&query=Cadaqu%C3%A9s"},{"name":"Tossa de Mar","lat":41.7195,"lon":2.9319,"category":"핵심 방문지","status":"Day 3 · Vila Vella 접근·주차 재확인","url":"https://www.google.com/maps/search/?api=1&query=Tossa+de+Mar"},{"name":"Sant Feliu de Guíxols","lat":41.78,"lon":3.0676,"category":"핵심 방문지","status":"Day 3 · GI-682 해안도로 재확인","url":"https://www.google.com/maps/search/?api=1&query=Sant+Feliu+de+Gu%C3%ADxols"},{"name":"Pals","lat":41.97039,"lon":3.14843,"category":"핵심 방문지","status":"Day 3 · 압축 산책","url":"https://www.google.com/maps/search/?api=1&query=Pals"},{"name":"Peratallada","lat":41.97618,"lon":3.09007,"category":"핵심 방문지","status":"Day 3 · 귀로의 핵심 마을","url":"https://www.google.com/maps/search/?api=1&query=Peratallada"},{"name":"Peralada","lat":42.30872,"lon":3.01017,"category":"대체안","status":"본 일정에서 제외·실제 예약 없음","url":"https://www.google.com/maps/search/?api=1&query=Peralada"},{"name":"Calella de Palafrugell","lat":41.88901,"lon":3.18416,"category":"대체안","status":"Day 3 핵심 일정에서 제외","url":"https://www.google.com/maps/search/?api=1&query=Calella+de+Palafrugell"}];
const colors={"확정 숙소":"#0b7a53","숙소 후보":"#7a4eab","핵심 방문지":"#1f4e78","시장·생활":"#2f7d32","교통":"#c75b12","대체안":"#b02a37"};
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const ll=[];
pts.forEach((p,i)=>{
 ll.push([p.lat,p.lon]);
 const marker=L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:2,fillColor:colors[p.category],fillOpacity:.95}).addTo(map);
 marker.bindPopup(`<b>${i+1}. ${p.name}</b><br>${p.category}<br><small>${p.status}</small><br><a target="_blank" href="${p.url}">Google Maps 열기</a>`);
});
L.polyline(ll,{color:'#59636e',weight:3,opacity:.6,dashArray:'7,8'}).addTo(map);
map.fitBounds(L.latLngBounds(ll).pad(.15));
</script></body></html>
