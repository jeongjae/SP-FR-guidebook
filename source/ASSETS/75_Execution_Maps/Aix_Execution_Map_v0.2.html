<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aix-en-Provence 실행지도 v0.2</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#map{height:100%;margin:0} body{font-family:Arial,'Noto Sans KR',sans-serif}
.panel{position:absolute;z-index:1000;left:12px;top:12px;background:#fffffff2;padding:12px 14px;border-radius:9px;box-shadow:0 2px 12px #0004;max-width:370px}
h1{font-size:18px;margin:0 0 5px} p{font-size:12px;margin:4px 0;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;font-size:11px}
.legend span{white-space:nowrap} .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.note{color:#8a3d12;font-weight:bold}
</style></head><body>
<div id="map"></div><div class="panel">
<h1>Aix-en-Provence 실행지도 v0.2</h1>
<p>Day 12–16 · 9/11 Marseille 기본일과 Cassis 선택 대안의 기준점. 번호는 개략 흐름이다.</p>
<p class="note">숙소 핀은 예약 전 후보이며 확정 주소가 아니다.</p>
<p>배경지도와 Google Maps 링크는 인터넷 연결이 필요하다. GeoJSON·KML은 별도 앱에서 사용할 수 있다.</p>
<div class="legend"><span><i style="background:#7a4eab"></i>숙소 후보</span><span><i style="background:#1f4e78"></i>핵심 방문지</span><span><i style="background:#2f7d32"></i>시장·생활</span><span><i style="background:#c75b12"></i>교통</span><span><i style="background:#b02a37"></i>근교·이동지</span></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const pts=[{"name": "Adagio Aix Centre", "lat": 43.528998, "lon": 5.440842, "category": "숙소 후보", "status": "후보 — 실제 예약 후 교체", "url": "https://www.google.com/maps/search/?api=1&query=Adagio+Aix+Centre"}, {"name": "Rotonde", "lat": 43.5267, "lon": 5.44582, "category": "교통", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Rotonde"}, {"name": "Cours Mirabeau", "lat": 43.52622, "lon": 5.44925, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Cours+Mirabeau"}, {"name": "Musée Granet", "lat": 43.52557, "lon": 5.45251, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Musée+Granet"}, {"name": "Cassis", "lat": 43.21401, "lon": 5.53962, "category": "근교·이동지", "status": "선택 대안 — Marseille와 결합 금지", "url": "https://www.google.com/maps/search/?api=1&query=Cassis"}, {"name": "Marseille Saint-Charles", "lat": 43.3026, "lon": 5.3805, "category": "교통", "status": "9/11 기본 당일치기 도착점", "url": "https://www.google.com/maps/search/?api=1&query=Marseille+Saint-Charles"}, {"name": "Vieux-Port", "lat": 43.2951, "lon": 5.374, "category": "핵심 방문지", "status": "9/11 기본 일정", "url": "https://www.google.com/maps/search/?api=1&query=Vieux-Port"}, {"name": "Le Panier", "lat": 43.3006, "lon": 5.3674, "category": "핵심 방문지", "status": "9/11 기본 일정", "url": "https://www.google.com/maps/search/?api=1&query=Le+Panier"}, {"name": "Mucem", "lat": 43.2967, "lon": 5.3612, "category": "핵심 방문지", "status": "9/11 기본 일정", "url": "https://www.google.com/maps/search/?api=1&query=Mucem"}, {"name": "Fort Saint-Jean", "lat": 43.2959, "lon": 5.3635, "category": "핵심 방문지", "status": "9/11 기본 일정", "url": "https://www.google.com/maps/search/?api=1&query=Fort+Saint-Jean"}, {"name": "Notre-Dame de la Garde", "lat": 43.2841, "lon": 5.3712, "category": "근교·이동지", "status": "체력·날씨에 따른 선택", "url": "https://www.google.com/maps/search/?api=1&query=Notre-Dame+de+la+Garde"}, {"name": "Atelier Cézanne", "lat": 43.53964, "lon": 5.44704, "category": "핵심 방문지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Atelier+Cézanne"}, {"name": "Lourmarin", "lat": 43.76373, "lon": 5.36383, "category": "근교·이동지", "status": "일정 기준점", "url": "https://www.google.com/maps/search/?api=1&query=Lourmarin"}];
const colors={"숙소 후보": "#7a4eab", "핵심 방문지": "#1f4e78", "시장·생활": "#2f7d32", "교통": "#c75b12", "근교·이동지": "#b02a37"};
const map=L.map('map');
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const ll=[];
pts.forEach((p,i)=>{
 ll.push([p.lat,p.lon]);
 const marker=L.circleMarker([p.lat,p.lon],{radius:8,color:'#fff',weight:2,fillColor:colors[p.category],fillOpacity:.95}).addTo(map);
 marker.bindPopup(`<b>${i+1}. ${p.name}</b><br>${p.category}<br><small>${p.status}</small><br><a target="_blank" href="${p.url}">Google Maps 열기</a>`);
});
L.polyline(ll,{color:'#59636e',weight:3,opacity:.6,dashArray:'7,8'}).addTo(map);
map.fitBounds(L.latLngBounds(ll).pad(.15));
</script></body></html>
