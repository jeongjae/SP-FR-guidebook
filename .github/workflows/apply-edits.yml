name: Apply field edits

# 폰(웹앱)이 data/field-edits/ 저널을 푸시하면 정본에 접는다.
# main 은 가드 green 커밋만 받는다 — 빌드·검증이 실패하면 커밋하지 않고
# 런을 붉게 남긴다 (저널은 그대로라 다음 수정 후 재실행하면 된다).

on:
  push:
    branches: [main]
    paths:
      - "data/field-edits/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-field-edits
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply journals to canonical files
        id: apply
        run: |
          pip install -r requirements-build.txt
          python3 scripts/apply_field_edits.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build + guards on folded result
        if: steps.apply.outputs.changed == 'true'
        run: |
          python3 build/site.py
          python3 build/app_check.py --static
          python3 build/place_relationship_audit.py
          python3 scripts/validate_itinerary.py

      - name: Commit to main
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name "spfr-apply-edits[bot]"
          git config user.email "apply-edits@users.noreply.github.com"
          git add data/field-notes.json data/booking-overrides.json \
            data/field-edits/state.json data/daily-cards source/CURRENT/30_Places
          git commit -m "[apply-edits] fold field edits into canonical data"
          git pull --rebase origin main
          git push origin main

      - name: Trigger pages deploy
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN 푸시는 다른 워크플로를 자동 트리거하지 않는다 —
          # 스냅샷 재빌드를 명시적으로 기동한다.
          gh workflow run pages.yml --ref main
