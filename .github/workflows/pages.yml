name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "build/**"
      - "scripts/**"
      # S0~S2 는 전부 데이터 작업이다. 이게 없으면 데이터만 바꾼 커밋이 배포되지 않는다.
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  # 배포 중 취소는 gh-pages 를 반쯤 덮은 상태로 남길 수 있다.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # workflow_dispatch 를 아무 브랜치에서 돌리면 라이브가 그 브랜치로 덮인다.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build site
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_MAPS_MAP_ID: ${{ secrets.GOOGLE_MAPS_MAP_ID }}
        run: |
          pip install -r requirements-build.txt
          python -m playwright install --with-deps chromium
          python3 scripts/generate_attributions.py --check
          python3 scripts/validate_map_data.py --quiet-warnings
          python3 build/build.py
          python3 scripts/validate_itinerary.py
          python3 scripts/validate_media.py
          python3 build/pwa_check.py
          python3 build/hig_check.py
          touch site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
